<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mini Planner</h1>
    </header>

    <main>
        <section class="input-section">
            <input type="text" id="noteInput" placeholder="Add a note or task...">
            <button id="addBtn">Add</button>
        </section>

        <section class="notes-section">
            <h2>Notes & Todos</h2>
            <ul id="notesList"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
