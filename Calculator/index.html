<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="index.css" rel="Stylesheet">
</head>
<body>
    <div id="Calculator">
        <input id="display" readonly>
        <div id="keys">
            <button onclick="appendByDisplay('+')" id="operator">+</button>
            <button onclick="appendByDisplay('7')">7</button>
            <button onclick="appendByDisplay('8')">8</button>
            <button onclick="appendByDisplay('9')">9</button>
            <button onclick="appendByDisplay('-')" id="operator">-</button>
            <button onclick="appendByDisplay('4')">4</button>
            <button onclick="appendByDisplay('5')">5</button>
            <button onclick="appendByDisplay('6')">6</button>
            <button onclick="appendByDisplay('*')" id="operator">x</button>
            <button onclick="appendByDisplay('1')">1</button>
            <button onclick="appendByDisplay('2')">2</button>
            <button onclick="appendByDisplay('3')">3</button>
            <button onclick="appendByDisplay('/')" id="operator">÷</button>
            <button onclick="appendByDisplay('0')">0</button>
            <button onclick="appendByDisplay('.')">.</button>
            <button onclick="calculate()" id="operator">=</button>
            <button onclick="clearDisplay()" id="operator">C</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
